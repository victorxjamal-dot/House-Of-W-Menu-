<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of W | Menu</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#000000">
<meta name="description" content="House of W — Food &amp; Beverage Menu">
<style>
  :root { --bg:#000; --gold:#c9a24a; --text:#e8dcc0; }
  :root[data-theme="dark"] { --bg:#000; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: Georgia, "Times New Roman", serif; }
  nav { position:sticky; top:0; z-index:5; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
        padding:10px 16px; background:rgba(0,0,0,.92); border-bottom:1px solid #3a2f17; }
  nav a { color:var(--gold); text-decoration:none; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
          padding:6px 12px; border:1px solid #5a4620; border-radius:2px; }
  main { max-width:760px; margin:0 auto; padding:12px 16px 32px; }
  img { display:block; width:100%; height:auto; margin:0 auto 14px; border:1px solid #2a2210; }
  footer { text-align:center; font-size:12px; color:#8c7a52; padding:0 16px 28px; font-style:italic; }
</style>
</head>
<body>
<nav>
  <a href="#food">Food</a>
  <a href="#drinks">Beverages</a>
  <a href="House_of_W_Menu.pdf" download>PDF</a>
</nav>
<main>
  <img src="pages/p-1.jpg" alt="House of W — Food &amp; Beverage Menu cover">
  <img id="food" src="pages/p-2.jpg" alt="Food menu: appetizers and bites" loading="lazy">
  <img src="pages/p-3.jpg" alt="Food menu: sandwiches and desserts" loading="lazy">
  <img id="drinks" src="pages/p-4.jpg" alt="Beverage menu: vodka, whiskey, tequila, rum" loading="lazy">
  <img src="pages/p-5.jpg" alt="Beverage menu: cognac, gin, wines, champagne, beers, cocktails, shisha, soft drinks" loading="lazy">
  <img src="pages/p-6.jpg" alt="House of W back cover" loading="lazy">
</main>
<footer>All prices are inclusive of 5% Tourism Levy, 10% VAT &amp; 10% Service Charge</footer>
</body>
</html>
